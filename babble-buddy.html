<title>Babble Buddy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Baloo+Bhaijaan+2:wght@500;700&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: a one-screen nursery stage. Buddy and the speech bubble on top, big picture tiles for small hands below, a quiet grown-ups bar at the foot. */
:root{
  --bg:#E4F1F3;
  --surface:#FFFFFF;
  --ink:#1C3340;
  --muted:#557080;
  --line:#C6DCE1;
  --accent:#C93468;
  --accent-ink:#FFFFFF;
  --sun:#FFC83D;
  --sun-deep:#F5A524;
  --cheek:#FF8FA8;
  --face:#1C3340;
  --t1:#FFE1EB; --t2:#D9F2E1; --t3:#E0E7FF; --t4:#FFEFC7;
  --shadow:0 10px 30px -18px rgba(28,51,64,.45);
  --display:"Baloo 2","Baloo Bhaijaan 2",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  --script:"Baloo 2","Baloo Bhaijaan 2","Noto Sans",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1E26; --surface:#172C37; --ink:#EAF4F6; --muted:#9DB6C2; --line:#2A4655;
    --accent:#FF6E9C; --accent-ink:#2A0A16;
    --sun:#FFC83D; --sun-deep:#E8961A; --cheek:#FF8FA8; --face:#1C3340;
    --t1:#3A2230; --t2:#1E3A2C; --t3:#232D4A; --t4:#3A3220;
    --shadow:0 10px 30px -18px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1E26; --surface:#172C37; --ink:#EAF4F6; --muted:#9DB6C2; --line:#2A4655;
  --accent:#FF6E9C; --accent-ink:#2A0A16;
  --sun:#FFC83D; --sun-deep:#E8961A; --cheek:#FF8FA8; --face:#1C3340;
  --t1:#3A2230; --t2:#1E3A2C; --t3:#232D4A; --t4:#3A3220;
  --shadow:0 10px 30px -18px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.app{max-width:940px;margin:0 auto;padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
.brand-name{font-family:var(--display);font-weight:800;font-size:1.6rem;letter-spacing:-.01em;line-height:1}
.brand-lang{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ghost{background:transparent;border:2px solid var(--line);border-radius:999px;padding:6px 16px;font-weight:700;cursor:pointer}
.ghost:hover{border-color:var(--muted)}

.settings{background:var(--surface);border-radius:22px;padding:20px;box-shadow:var(--shadow);display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px 20px}
.settings h2{grid-column:1/-1;margin:0;font-family:var(--display);font-size:1.25rem}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lbl{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.field input[type=text],.field select{width:100%;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 12px}
.field label.check{display:flex;align-items:center;gap:10px;font-size:1rem;font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink)}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.field input[type=range]{width:100%;accent-color:var(--accent)}
.voice-note{grid-column:1/-1;margin:0;font-size:.9rem;color:var(--muted)}
.voice-note:empty{display:none}
.settings-foot{grid-column:1/-1;display:flex;justify-content:flex-end}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:10px 22px;font-weight:700;cursor:pointer}

.stage{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.buddy-col{display:flex;flex-direction:column;align-items:center;gap:10px}
.buddy{width:150px;height:150px;display:block}
.b-body{fill:var(--sun)} .b-petal{fill:var(--sun-deep)} .b-cheek{fill:var(--cheek);opacity:.55}
.b-face{fill:var(--face)} .b-glint{fill:#fff} .b-smile{fill:none;stroke:var(--face);stroke-width:5;stroke-linecap:round}
.eyes{transform-box:view-box;transform-origin:80px 70px;animation:blink 5s infinite}
.mouth-open{opacity:0;transform-box:view-box;transform-origin:80px 98px}
.petals{transform-box:view-box;transform-origin:80px 80px;transition:transform .6s}
.buddy.talking .mouth-open{opacity:1;animation:chatter .22s ease-in-out infinite alternate}
.buddy.talking .b-smile{opacity:0}
.buddy.thinking{animation:bob 1.1s ease-in-out infinite}
.buddy.thinking .petals{animation:spin 3s linear infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes chatter{from{transform:scaleY(.3)}to{transform:scaleY(1.05)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes spin{to{transform:rotate(360deg)}}

.picture{width:96px;height:96px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;font-size:3.2rem;line-height:1;overflow:hidden}
.picture .swatch{width:64px;height:64px;border-radius:50%}
.picture .stars{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;font-size:1.25rem;max-width:80px}
.picture.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:scale(1)}}

.bubble{position:relative;background:var(--surface);border-radius:28px;padding:22px 24px 16px;box-shadow:var(--shadow);cursor:pointer;min-width:0;display:flex;flex-direction:column;gap:8px}
.bubble::before{content:"";position:absolute;left:-14px;top:50%;width:28px;height:28px;background:var(--surface);transform:translateY(-50%) rotate(45deg);border-radius:6px}
.say{margin:0;font-family:var(--script);font-weight:700;font-size:clamp(1.6rem,4.4vw,2.4rem);line-height:1.35;white-space:pre-line;overflow-wrap:anywhere;position:relative}
.say.idle{font-family:var(--body);font-weight:700;font-size:1.25rem;color:var(--muted)}
.say.wait{color:var(--muted)}
.meaning{margin:0;color:var(--muted);font-size:1rem;white-space:pre-line;position:relative}
.meaning:empty{display:none}
.bubble-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:relative;padding-top:4px;border-top:1px dashed var(--line)}
.again{background:transparent;border:0;padding:6px 0;font-weight:700;color:var(--accent);cursor:pointer}
.status{font-size:.9rem;color:var(--muted)}
.dots span{display:inline-block;animation:dot 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{opacity:.25}50%{opacity:1}}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{aspect-ratio:1/1;max-width:100%;border:0;border-radius:24px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform .12s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.tile:nth-child(4n+1){background:var(--t1)} .tile:nth-child(4n+2){background:var(--t2)} .tile:nth-child(4n+3){background:var(--t3)} .tile:nth-child(4n+4){background:var(--t4)}
.tile .pic{font-size:clamp(2.4rem,9vw,3.1rem);line-height:1}
.tile .lbl{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.tile:active{transform:scale(.93)}
.tiles.busy .tile{opacity:.6}

.parent{display:flex;flex-direction:column;gap:8px;padding-top:16px;border-top:2px dashed var(--line)}
.parent label{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.row{display:flex;gap:10px}
.row input{flex:1;min-width:0;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px}
.foot-note{margin:0;font-size:.85rem;color:var(--muted);max-width:65ch}

@media (min-width:880px){
  .tiles{grid-template-columns:repeat(9,minmax(0,1fr));gap:10px}
  .tile .pic{font-size:2.4rem}
}
@media (max-width:560px){
  .stage{grid-template-columns:1fr;gap:14px}
  .buddy-col{flex-direction:row;justify-content:center;gap:18px}
  .buddy{width:118px;height:118px}
  .bubble::before{left:50%;top:-12px;transform:translateX(-50%) rotate(45deg)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <span class="brand-name">Babble Buddy</span>
      <span class="brand-lang" id="langBadge">Arabic (Egyptian)</span>
    </div>
    <button type="button" class="ghost" id="settingsBtn" aria-expanded="false" aria-controls="settings">Grown-ups</button>
  </header>

  <section class="settings" id="settings" hidden>
    <h2>Set up Buddy</h2>
    <div class="field">
      <label for="childName">Child's name</label>
      <input type="text" id="childName" autocomplete="off" placeholder="e.g. Yassin">
    </div>
    <div class="field">
      <label for="lang">Mother tongue</label>
      <select id="lang"></select>
    </div>
    <div class="field" id="otherWrap" hidden>
      <label for="otherLang">Which language?</label>
      <input type="text" id="otherLang" autocomplete="off" placeholder="e.g. Nubian, Amazigh, Pashto">
    </div>
    <div class="field">
      <label for="age">Age</label>
      <select id="age">
        <option value="1">1 to 2 years</option>
        <option value="2">2 to 3 years</option>
        <option value="3">3 to 4 years</option>
      </select>
    </div>
    <div class="field">
      <label for="rate">Speaking speed</label>
      <input type="range" id="rate" min="0.6" max="1.1" step="0.05" value="0.85">
    </div>
    <div class="field">
      <span class="lbl">For grown-ups</span>
      <label class="check" for="showMeaning"><input type="checkbox" id="showMeaning" checked> Show English meaning</label>
    </div>
    <p class="voice-note" id="voiceNote"></p>
    <div class="settings-foot"><button type="button" class="primary" id="closeSettings">Done</button></div>
  </section>

  <main class="stage">
    <div class="buddy-col">
      <svg class="buddy" id="buddy" viewBox="0 0 160 160" aria-hidden="true">
        <g class="petals">
          <circle class="b-petal" cx="138" cy="80" r="16"/><circle class="b-petal" cx="121" cy="121" r="16"/>
          <circle class="b-petal" cx="80" cy="138" r="16"/><circle class="b-petal" cx="39" cy="121" r="16"/>
          <circle class="b-petal" cx="22" cy="80" r="16"/><circle class="b-petal" cx="39" cy="39" r="16"/>
          <circle class="b-petal" cx="80" cy="22" r="16"/><circle class="b-petal" cx="121" cy="39" r="16"/>
        </g>
        <circle class="b-body" cx="80" cy="80" r="56"/>
        <circle class="b-cheek" cx="50" cy="90" r="9"/><circle class="b-cheek" cx="110" cy="90" r="9"/>
        <g class="eyes">
          <ellipse class="b-face" cx="62" cy="70" rx="7" ry="9"/><ellipse class="b-face" cx="98" cy="70" rx="7" ry="9"/>
          <circle class="b-glint" cx="64.5" cy="66.5" r="2.4"/><circle class="b-glint" cx="100.5" cy="66.5" r="2.4"/>
        </g>
        <path class="b-smile" d="M64 92 Q80 108 96 92"/>
        <ellipse class="b-face mouth-open" cx="80" cy="98" rx="12" ry="10"/>
      </svg>
      <div class="picture" id="picture" aria-hidden="true">👋</div>
    </div>

    <div class="bubble" id="bubble" role="button" tabindex="0" aria-label="Say it again">
      <p class="say" id="say" dir="auto"></p>
      <p class="meaning" id="meaning"></p>
      <div class="bubble-foot">
        <button type="button" class="again" id="againBtn">Say it again</button>
        <span class="status" id="status" aria-live="polite"></span>
      </div>
    </div>
  </main>

  <section class="tiles" id="tiles" aria-label="Pick something to talk about"></section>

  <form class="parent" id="parentForm" autocomplete="off">
    <label for="childSaid">Your child said… (Buddy can't hear yet, so type it for them)</label>
    <div class="row">
      <input type="text" id="childSaid" placeholder="Any spelling is fine, e.g. “ana 3ayez mayya”">
      <button type="submit" class="primary">Answer</button>
    </div>
  </form>

  <p class="foot-note" id="footNote">Buddy writes every reply fresh with Claude, on your own Claude account, and reads it aloud with this device's voice. Stay close while your little one plays.</p>
</div>

<script>
(function(){
  "use strict";

  // ---------- Languages ----------
  // hello/meaning: a built-in opening line. {…n} segments hold the child's name and vanish when no name is set.
  var LANGS = [
    {id:"ar-EG", name:"Arabic (Egyptian)", code:"ar-EG", note:"Use everyday Egyptian Arabic (Masri), the way a mother talks at home, not Modern Standard Arabic.", hello:"أهلاً{ يا n}! يلا نلعب سوا؟", meaning:"Hi{ n}! Shall we play together?"},
    {id:"ar-GULF", name:"Arabic (Gulf)", code:"ar-SA", note:"Use everyday Gulf Arabic (Khaleeji) as spoken at home.", hello:"هلا{ يا n}! تبي نلعب سوا؟", meaning:"Hi{ n}! Do you want to play together?"},
    {id:"ar-LEV", name:"Arabic (Levantine)", code:"ar", note:"Use everyday Levantine Arabic (Shami) as spoken at home.", hello:"مرحبا{ يا n}! بدّك نلعب سوا؟", meaning:"Hello{ n}! Do you want to play together?"},
    {id:"ar-MA", name:"Arabic (Moroccan Darija)", code:"ar-MA", note:"Use everyday Moroccan Darija as spoken at home, written in Arabic script."},
    {id:"ar-MSA", name:"Arabic (Standard)", code:"ar", note:"Use very simple Modern Standard Arabic (Fusha).", hello:"مرحباً{ يا n}! هيّا نلعب معاً.", meaning:"Hello{ n}! Let's play together."},
    {id:"am", name:"Amharic", code:"am-ET"},
    {id:"bn", name:"Bengali", code:"bn-BD"},
    {id:"yue", name:"Cantonese", code:"zh-HK", note:"Write spoken Cantonese in Traditional Chinese characters."},
    {id:"zh", name:"Chinese (Mandarin)", code:"zh-CN", note:"Write in Simplified Chinese characters.", hello:"你好{，n}！我们一起玩吧？", meaning:"Hello{ n}! Let's play together?"},
    {id:"nl", name:"Dutch", code:"nl-NL", hello:"Hoi{ n}! Zullen we samen spelen?", meaning:"Hi{ n}! Shall we play together?"},
    {id:"en", name:"English", code:"en-US", hello:"Hi{ n}! Want to play with me?", meaning:""},
    {id:"fil", name:"Filipino (Tagalog)", code:"fil-PH"},
    {id:"fr", name:"French", code:"fr-FR", hello:"Coucou{ n} ! On joue ensemble ?", meaning:"Hi{ n}! Shall we play together?"},
    {id:"de", name:"German", code:"de-DE", hello:"Hallo{ n}! Wollen wir zusammen spielen?", meaning:"Hello{ n}! Shall we play together?"},
    {id:"el", name:"Greek", code:"el-GR"},
    {id:"he", name:"Hebrew", code:"he-IL"},
    {id:"hi", name:"Hindi", code:"hi-IN", hello:"नमस्ते{ n}! चलो साथ में खेलें?", meaning:"Hello{ n}! Shall we play together?"},
    {id:"id", name:"Indonesian", code:"id-ID", hello:"Halo{ n}! Main bareng, yuk?", meaning:"Hello{ n}! Let's play together!"},
    {id:"it", name:"Italian", code:"it-IT", hello:"Ciao{ n}! Giochiamo insieme?", meaning:"Hi{ n}! Shall we play together?"},
    {id:"ja", name:"Japanese", code:"ja-JP", note:"Use mostly hiragana, as in picture books for little children.", hello:"こんにちは{、nちゃん}！いっしょに あそぼう？", meaning:"Hello{ n}! Shall we play together?"},
    {id:"ko", name:"Korean", code:"ko-KR", hello:"안녕{, n}! 같이 놀까?", meaning:"Hi{ n}! Shall we play together?"},
    {id:"ms", name:"Malay", code:"ms-MY"},
    {id:"fa", name:"Persian (Farsi)", code:"fa-IR", hello:"سلام{ n}! بیا با هم بازی کنیم؟", meaning:"Hi{ n}! Shall we play together?"},
    {id:"pl", name:"Polish", code:"pl-PL"},
    {id:"pt-BR", name:"Portuguese (Brazil)", code:"pt-BR", hello:"Oi{, n}! Vamos brincar?", meaning:"Hi{ n}! Shall we play?"},
    {id:"pt-PT", name:"Portuguese (Portugal)", code:"pt-PT"},
    {id:"ru", name:"Russian", code:"ru-RU", hello:"Привет{, n}! Давай играть?", meaning:"Hi{ n}! Let's play?"},
    {id:"so", name:"Somali", code:"so-SO"},
    {id:"es-ES", name:"Spanish (Spain)", code:"es-ES", hello:"¡Hola{, n}! ¿Jugamos juntos?", meaning:"Hello{ n}! Shall we play together?"},
    {id:"es-419", name:"Spanish (Latin America)", code:"es-MX", hello:"¡Hola{, n}! ¿Jugamos juntos?", meaning:"Hello{ n}! Shall we play together?"},
    {id:"sw", name:"Swahili", code:"sw-KE", hello:"Jambo{ n}! Tucheze pamoja?", meaning:"Hello{ n}! Shall we play together?"},
    {id:"sv", name:"Swedish", code:"sv-SE"},
    {id:"ta", name:"Tamil", code:"ta-IN"},
    {id:"th", name:"Thai", code:"th-TH"},
    {id:"tr", name:"Turkish", code:"tr-TR", hello:"Merhaba{ n}! Birlikte oynayalım mı?", meaning:"Hello{ n}! Shall we play together?"},
    {id:"uk", name:"Ukrainian", code:"uk-UA"},
    {id:"ur", name:"Urdu", code:"ur-PK", hello:"ہیلو{ n}! آؤ مل کر کھیلیں؟", meaning:"Hello{ n}! Let's play together?"},
    {id:"vi", name:"Vietnamese", code:"vi-VN"},
    {id:"yo", name:"Yoruba", code:"yo-NG"},
    {id:"other", name:"Another language…", code:""}
  ];

  var AGES = {
    "1": {text:"1 to 2 years old", guide:"Use 2 to 5 words per sentence, lots of repetition, fun sounds and the names of things."},
    "2": {text:"2 to 3 years old", guide:"Use 3 to 7 words per sentence, simple everyday words, and repeat the key word."},
    "3": {text:"3 to 4 years old", guide:"Use short sentences of up to 10 words, simple words, and a little playful imagination."}
  };

  // ---------- Activities ----------
  var TOPICS = [
    {id:"hello", pic:"👋", label:"Hello", ask:function(n){return "Greet "+n+" warmly and invite them to play with you.";}},
    {id:"animals", pic:"🐶", label:"Animals", items:[["🐶","dog"],["🐱","cat"],["🐄","cow"],["🦁","lion"],["🦆","duck"],["🐑","sheep"],["🐘","elephant"],["🐸","frog"],["🐔","chicken"],["🐴","horse"],["🐟","fish"]],
      ask:function(n,it){return "Show "+n+" a picture of a "+it[1]+". Say its name and the sound it makes, the way people say that animal sound in this language. Invite "+n+" to make the sound too.";}},
    {id:"colors", pic:"🎨", label:"Colors", kind:"color", items:[["#E53935","red"],["#1E63D6","blue"],["#FFD21F","yellow"],["#2E9E4F","green"],["#FF8A1F","orange"],["#8E44C9","purple"],["#FF7FB0","pink"]],

    {id:"food", pic:"🍎", label:"Food", items:[["🍎","apple"],["🍌","banana"],["🍞","bread"],["🥛","milk"],["🍚","rice"],["🍊","orange"],["🥚","egg"],["🥕","carrot"]],
      ask:function(n,it){return "Show "+n+" a "+it[1]+". Name it, say something yummy about it, and ask if "+n+" likes it (a yes or no question).";}},
    {id:"body", pic:"👃", label:"Body", items:[["👃","nose"],["👀","eyes"],["👂","ears"],["✋","hands"],["🦶","feet"],["👄","mouth"]],

    {id:"song", pic:"🎵", label:"Song",
      ask:function(n){return "Sing a very short song for "+n+" (4 short lines, each line on its own line). Prefer a traditional folk children's song in this language if you know its words accurately; otherwise make up a simple one about play, animals or family.";}},
    {id:"story", pic:"📖", label:"Story", items:[["🐰","little bunny"],["🐻","little bear"],["🐥","little chick"],["🐢","little turtle"],["🐦","little bird"]],

    {id:"night", pic:"🌙", label:"Goodnight",
      ask:function(n){return "Say a soft, sleepy goodnight to "+n+". Mention the moon and a hug.";}}
  ];

  // ---------- Elements ----------
  function $(id){return document.getElementById(id);}
  var els = {
    langBadge:$("langBadge"), settingsBtn:$("settingsBtn"), settings:$("settings"), closeSettings:$("closeSettings"),
    childName:$("childName"), lang:$("lang"), otherWrap:$("otherWrap"), otherLang:$("otherLang"), age:$("age"),
    rate:$("rate"), showMeaning:$("showMeaning"), voiceNote:$("voiceNote"),
    buddy:$("buddy"), picture:$("picture"), bubble:$("bubble"), say:$("say"), meaning:$("meaning"),

  };

  // ---------- Settings (remembered on this device only) ----------
  var STORE_KEY = "babble-buddy-settings";
  var settings = {name:"", lang:"ar-EG", other:"", age:"2", rate:0.85, meaning:true};
  try { var saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); if (saved && typeof saved === "object") Object.assign(settings, saved); } catch(e){}
  function saveSettings(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(settings)); } catch(e){} }
  function langObj(){ for (var i=0;i<LANGS.length;i++) if (LANGS[i].id===settings.lang) return LANGS[i]; return LANGS[0]; }
  function langName(){ var L=langObj(); return L.id==="other" ? (settings.other.trim() || "the child's home language") : L.name; }
  function childName(){ return settings.name.trim(); }

  LANGS.forEach(function(L){ var o=document.createElement("option"); o.value=L.id; o.textContent=L.name; els.lang.appendChild(o); });
  function fillSettingsForm(){
    els.childName.value = settings.name; els.lang.value = langObj().id; els.otherLang.value = settings.other;
    els.age.value = AGES[settings.age] ? settings.age : "2"; els.rate.value = settings.rate; els.showMeaning.checked = !!settings.meaning;
    els.otherWrap.hidden = settings.lang !== "other";
  }
  fillSettingsForm();

  // ---------- Conversation state ----------
  var turns = [];
  var busy = false;
  var current = {say:"", meaning:""};
  var lastItem = {};

  function rules(){
    var n = childName() || "the child";
    var L = langObj(); var age = AGES[settings.age] || AGES["2"];
    return [
      "You are Babble Buddy, a warm, playful sunflower friend who talks with a toddler named "+n+", who is "+age.text+".",
      "You speak ONLY "+langName()+", written in its usual native script. "+(L.note||""),
      "Never switch to English or any other language in \"say\", even when the child's words are typed in another language or in Latin letters.",
      "How to talk:",
      "- Keep it very short: 1 or 2 short sentences (a song or story may be a little longer when asked). "+age.guide,
      "- Be cheerful, gentle and encouraging. Praise effort. Use "+n+"'s name now and then.",
      "- At most one simple question per reply, such as yes or no, or 'can you point to it?'.",
      "- Keep everything safe and kind: nothing scary, sad or violent, no brands, never ask for personal details like address, school or phone, and never suggest going anywhere or doing anything risky.",
      "- If the child seems hurt, scared or upset, or asks for help, gently tell them to go to mommy, daddy or a grown-up right now.",
      "- No emoji, no markup.",
      "The child's words are typed by a parent and may be misspelled, transliterated or mixed with English. Guess the meaning kindly and answer like a loving family member would.",
      "Reply with only a JSON object: {\"say\": \"what you say aloud, in "+langName()+"\", \"meaning\": \"the same in simple English for the parent\"}"
    ].join("\n");
  }

  function trimTurns(){
    while (turns.length > 12) turns.shift();
    while (turns.length && turns[0].role !== "user") turns.shift();
  }

  // ---------- Claude ----------
  var samplePromise = (async function(){
    try { return (window.claude && window.claude.use) ? await window.claude.use("sample") : null; }
    catch(e){ return null; }
  })();
  var sampleBlocked = false;

  var ERRORS = {
    not_granted:"Buddy needs your OK to use Claude. Allow it from this page's Permissions menu, then reload.",
    sampling_disabled:"Claude isn't available on this account, so Buddy can't talk right now.",
    not_declared:"This copy of Buddy can't reach Claude. Reload the page.",
    capability_disabled:"Buddy can't reach Claude in this view. Open the page on claude.ai.",
    capability_removed:"This Claude app is too old for Buddy. Update the app or open claude.ai in a browser.",
    rate_limited:"Buddy needs a little rest. Try again in a minute.",
    session_expired:"Please sign in to Claude again, then tap a picture.",
    refused:"Buddy couldn't answer that one. Try another picture.",
    empty_completion:"Buddy got mixed up. Tap the picture again.",
    invalid_json:"Buddy got mixed up. Tap the picture again.",
    upstream_error:"Buddy lost the connection. Tap the picture again."
  };
  var BLOCKING = {not_granted:1, sampling_disabled:1, not_declared:1, capability_disabled:1, capability_removed:1};

  async function ask(content, picture){
    if (busy) return;
    if (sampleBlocked){ setPicture(picture); setStatus(ERRORS.not_granted); return; }
    busy = true;
    setPicture(picture);
    setThinking(true);
    turns.push({role:"user", content:content});
    trimTurns();
    var sample = await samplePromise;
    if (!sample){
      turns.pop();
      showCurrent();
      setThinking(false); busy = false;
      setStatus("Buddy talks through Claude. Open this page on claude.ai while signed in.");
      return;
    }
    try {
      var r = await sample.json([{role:"user", content:rules()}].concat(turns), {modelTier:"quick", cache:false});
      var say = String((r && r.say) || "").trim();
      var meaning = String((r && r.meaning) || "").trim();
      if (!say) throw {code:"empty_completion"};
      turns.push({role:"assistant", content:JSON.stringify({say:say, meaning:meaning})});
      current = {say:say, meaning:meaning};
      showCurrent();
      setStatus("");
      speak(say);
    } catch(e){
      if (turns.length && turns[turns.length-1].role === "user") turns.pop();
      showCurrent();
      var code = (e && e.code) || "upstream_error";
      if (BLOCKING[code]) sampleBlocked = true;
      if (code !== "cancelled") setStatus(ERRORS[code] || ERRORS.upstream_error);
    } finally {
      setThinking(false);
      busy = false;
    }
  }

  // ---------- Speech ----------
  var hasTTS = "speechSynthesis" in window && typeof SpeechSynthesisUtterance === "function";
  var talkTimer = null;
  function pickVoice(){
    if (!hasTTS) return null;
    var code = (langObj().code || "").toLowerCase(); if (!code) return null;
    var base = code.split("-")[0];
    var vs = []; try { vs = speechSynthesis.getVoices() || []; } catch(e){}
    var norm = function(v){ return String(v.lang||"").toLowerCase().replace("_","-"); };
    return vs.filter(function(v){return norm(v)===code;})[0] || vs.filter(function(v){return norm(v).split("-")[0]===base;})[0] || null;
  }
  function mouthFor(ms){
    els.buddy.classList.add("talking");
    clearTimeout(talkTimer);
    talkTimer = setTimeout(function(){ els.buddy.classList.remove("talking"); }, ms);
  }
  function speak(text){
    var est = Math.min(12000, 600 + text.length * 70 / (settings.rate || 1));
    if (!hasTTS){ mouthFor(est); return; }
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text.replace(/\n+/g, ". "));
      var code = langObj().code; if (code) u.lang = code;
      var v = pickVoice(); if (v) u.voice = v;
      u.rate = Number(settings.rate) || 0.85;
      u.pitch = 1.15;
      u.onstart = function(){ mouthFor(est * 1.5); };
      u.onend = u.onerror = function(){ clearTimeout(talkTimer); els.buddy.classList.remove("talking"); };
      speechSynthesis.speak(u);
      mouthFor(est); // keep the mouth moving even if the browser never fires onstart
    } catch(e){ mouthFor(est); }
  }
  // iOS only lets speech start from a tap, so warm it up on the first touch.
  var unlocked = false;
  document.addEventListener("pointerdown", function(){
    if (unlocked || !hasTTS) return; unlocked = true;
    try { var u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } catch(e){}
  }, {capture:true});

  function updateVoiceNote(){
    var note = "";
    if (!hasTTS) note = "This browser can't read aloud, so Buddy will show the words for you to read.";
    else if (!langObj().code) note = "For "+langName()+", Buddy shows the words and you read them aloud. Device voices may not know this language.";
    else {
      var vs = []; try { vs = speechSynthesis.getVoices() || []; } catch(e){}
      if (vs.length && !pickVoice()) note = "This device has no "+langObj().name+" voice yet, so Buddy may speak with the wrong accent or stay quiet. Add one in your phone or computer's language and speech settings.";
    }
    els.voiceNote.textContent = note;
  }
  if (hasTTS){ try { speechSynthesis.onvoiceschanged = updateVoiceNote; } catch(e){} }

  // ---------- Rendering ----------
  function fillName(tpl){
    var n = childName();
    return tpl.replace(/\{([^}]*)\}/g, function(m, inner){ return n ? inner.replace("n", n) : ""; });
  }
  function greeting(){
    var L = langObj();
    if (L.hello) return {say:fillName(L.hello), meaning:L.meaning ? fillName(L.meaning) : ""};
    return null;
  }
  function showCurrent(){
    els.say.classList.remove("wait","idle");
    if (current.say){
      els.say.textContent = current.say;
      var showM = settings.meaning && current.meaning && current.meaning !== current.say;
      els.meaning.textContent = showM ? current.meaning : "";
    } else {
      els.say.classList.add("idle");
      els.say.textContent = "Tap a picture and I'll talk in "+langName()+"!";
      els.meaning.textContent = "";
    }
    els.againBtn.hidden = !current.say;
  }
  function setThinking(on){
    els.buddy.classList.toggle("thinking", on);
    els.tiles.classList.toggle("busy", on);
    if (on){
      els.say.classList.remove("idle"); els.say.classList.add("wait");
      els.say.innerHTML = '<span class="dots" aria-label="Buddy is thinking"><span>●</span> <span>●</span> <span>●</span></span>';
      els.meaning.textContent = "";
      setStatus("");
    }
  }
  function setStatus(t){ els.status.textContent = t; }
  function setPicture(p){
    var box = els.picture; box.innerHTML = "";
    if (!p) p = {kind:"emoji", v:"👋"};
    if (p.kind === "color"){ var s=document.createElement("span"); s.className="swatch"; s.style.background=p.v; box.appendChild(s); }
    else if (p.kind === "count"){ var st=document.createElement("span"); st.className="stars"; st.textContent = new Array(p.v+1).join("⭐"); box.appendChild(st); }
    else box.textContent = p.v;
    box.classList.remove("pop"); void box.offsetWidth; box.classList.add("pop");
  }
  function updateBadge(){ els.langBadge.textContent = langName(); }

  function resetConversation(){
    turns = [];
    current = greeting() || {say:"", meaning:""};
    setPicture({kind:"emoji", v:"👋"});
    showCurrent();
    setStatus("");
  }

  // ---------- Tiles ----------
  function pickItem(t){
    if (!t.items) return null;
    var i, tries = 0;
    do { i = Math.floor(Math.random()*t.items.length); tries++; } while (t.items.length > 1 && i === lastItem[t.id] && tries < 6);
    lastItem[t.id] = i;
    return t.items[i];
  }
  TOPICS.forEach(function(t){
    var b = document.createElement("button");
    b.type = "button"; b.className = "tile"; b.id = "tile-"+t.id;
    b.setAttribute("aria-label", t.label);
    b.innerHTML = '<span class="pic" aria-hidden="true"></span><span class="lbl"></span>';
    b.querySelector(".pic").textContent = t.pic;
    b.querySelector(".lbl").textContent = t.label;
    b.addEventListener("click", function(){
      if (busy) return;
      var it = pickItem(t);
      var pic = !it ? {kind:"emoji", v:t.pic} : t.kind==="color" ? {kind:"color", v:it[0]} : t.kind==="count" ? {kind:"count", v:it[0]} : {kind:"emoji", v:it[0]};
      ask("[Activity] " + t.ask(childName() || "the child", it), pic);
    });
    els.tiles.appendChild(b);
  });

  // ---------- Events ----------
  function sayAgain(){ if (current.say && !busy) speak(current.say); }
  els.bubble.addEventListener("click", function(e){ if (e.target.closest("button")) return; sayAgain(); });
  els.bubble.addEventListener("keydown", function(e){ if (e.target === els.bubble && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); sayAgain(); } });
  els.againBtn.addEventListener("click", sayAgain);

  els.parentForm.addEventListener("submit", function(e){
    e.preventDefault();
    var t = els.childSaid.value.trim(); if (!t || busy) return;
    els.childSaid.value = "";
    ask("[" + (childName() || "The child") + " said] " + t, {kind:"emoji", v:"💬"});
  });

  function toggleSettings(open){
    els.settings.hidden = !open;
    els.settingsBtn.setAttribute("aria-expanded", open ? "true" : "false");
    if (open){ updateVoiceNote(); els.childName.focus(); }
  }
  els.settingsBtn.addEventListener("click", function(){ toggleSettings(els.settings.hidden); });
  els.closeSettings.addEventListener("click", function(){ toggleSettings(false); els.settingsBtn.focus(); });

  function onSettingsChange(resetTalk){
    settings.name = els.childName.value.slice(0, 40);
    settings.lang = els.lang.value;
    settings.other = els.otherLang.value.slice(0, 60);
    settings.age = els.age.value;
    settings.rate = Number(els.rate.value);
    settings.meaning = els.showMeaning.checked;
    els.otherWrap.hidden = settings.lang !== "other";
    saveSettings(); updateBadge(); updateVoiceNote();
    if (resetTalk && !busy) resetConversation(); else showCurrent();
  }
  els.childName.addEventListener("change", function(){ onSettingsChange(true); });
  els.lang.addEventListener("change", function(){ onSettingsChange(true); });
  els.otherLang.addEventListener("change", function(){ onSettingsChange(true); });
  els.age.addEventListener("change", function(){ onSettingsChange(false); });
  els.rate.addEventListener("change", function(){ onSettingsChange(false); });
  els.showMeaning.addEventListener("change", function(){ onSettingsChange(false); });

  // ---------- Start ----------
  updateBadge();
  resetConversation();
  updateVoiceNote();
  samplePromise.then(function(s){
    if (!s) setStatus("Buddy talks through Claude. Open this page on claude.ai while signed in.");
  });
})();
</script>
